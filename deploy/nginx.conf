# nginx 反向代理 — 把 https://upwork.你的網域 轉到本機 127.0.0.1:8787
# 放到 /etc/nginx/conf.d/upwork-job-finder.conf,把 server_name 改成你的子網域。
# HTTPS 憑證用 certbot 自動申請(見 DEPLOY.md)。

server {
    listen 80;
    server_name upwork.example.com;   # ← 改成你的子網域

    # certbot 會自動補上 HTTPS 轉址;先放著讓它驗證
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # analyze 產評估網站較久,給足時間
    }
}
